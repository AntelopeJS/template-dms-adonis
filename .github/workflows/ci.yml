name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      # `pnpm test` boots the whole application, and the Antelope runtime
      # connects to MongoDB while constructing its modules.
      services-compose-file: .github/compose.yml
      # Windows runners skip the compose services but ship MongoDB 7 as a
      # disabled service, the major version of the compose image.
      setup-commands: |
        if [ "$RUNNER_OS" = Windows ]; then
          powershell -NoProfile -Command 'Set-Service MongoDB -StartupType Manual; Start-Service MongoDB'
          mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'
        fi
      # The template's own journeys first: `.github/scripts/template/` scaffolds
      # a project with `ajs project init --template` and drives it, each test
      # beside a MongoDB container of its own, so they run on Linux only, and
      # outside the fast tier of a pull request. `.github/scripts` stays out of
      # every scaffolded project, whose copy of this workflow skips both lines.
      # Then the build, then the server a user starts: AdonisJS on :3333 with the
      # DMS API on :5010. `/dms/info` answers only once the runtime has started
      # every module. `node ace serve` validates its environment from `.env`.
      extra-commands: |
        if [ -d .github/scripts/template ]; then
          pnpm exec tsc -p .github/scripts/template
          if [ "$ANTELOPEJS_CI_TIER" != fast ] && [ "$RUNNER_OS" = Linux ]; then
            node --test --test-concurrency=3 --test-timeout=1200000 --test-global-setup=.github/scripts/template/setup.ts '.github/scripts/template/*.test.ts'
          fi
        fi
        pnpm build
        cp .env.example .env
        node ace generate:key
        node ace serve > server.log 2>&1 &
        for _ in $(seq 1 60); do
          curl -sf -o info.json http://localhost:3333/dms/info && break
          sleep 2
        done
        cat info.json || { cat server.log; exit 1; }
        curl -sf http://localhost:3333/ | grep -q '"running":true'
        grep -q '@antelopejs/dms-frontend-vue' info.json
        curl -s -o /dev/null -w '%{http_code}' 'http://localhost:5010/dms/page?path=/home' | grep -q 200
      renovate-sync: false
      test-job: true
      docs-files: |
        README.md
      affected-tests: true
      nightly: ${{ inputs.nightly == true }}
    permissions:
      contents: read
  demo-drift:
    if: github.repository == 'AntelopeJS/template-dms-adonis'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AntelopeJS/template-dms-demo
          ref: main
          path: .template-dms-demo
          persist-credentials: false
      - run: scripts/sync-demo.sh .template-dms-demo
      - run: |
          drift=$(git status --porcelain -- demo)
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::demo/ differs from template-dms-demo main: run pnpm demo:sync <template-dms-demo checkout> and commit the result"
            exit 1
          fi
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
  verdict:
    needs: [ci, demo-drift, renovate-sync]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER_CI || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
