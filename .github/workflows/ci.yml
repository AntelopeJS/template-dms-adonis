name: ci

on:
  push:
    branches:
      - main
  # No branch filter: pull requests get stacked on top of each other, and a
  # filter on `main` would leave every intermediate step without a gate.
  pull_request:

  workflow_dispatch: null
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      # `pnpm test` boots the whole application, and the Antelope runtime
      # connects to MongoDB while constructing its modules.
      services-compose-file: .github/compose.yml
      # Windows runners skip the compose services but ship MongoDB 7 as a
      # disabled service, the major version of the compose image.
      setup-commands: |
        if [ "$RUNNER_OS" = Windows ]; then
          powershell -NoProfile -Command 'Set-Service MongoDB -StartupType Manual; Start-Service MongoDB'
          mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'
        fi
      # The build, then the server a user starts: AdonisJS on :3333 with the
      # DMS API on :5010. `/dms/info` answers only once the runtime has started
      # every module. `node ace serve` validates its environment from `.env`.
      extra-commands: |
        pnpm build
        cp .env.example .env
        node ace generate:key
        node ace serve > server.log 2>&1 &
        for _ in $(seq 1 60); do
          curl -sf http://localhost:3333/dms/info > info.json && break
          sleep 2
        done
        cat info.json || { cat server.log; exit 1; }
        curl -sf http://localhost:3333/ | grep -q '"running":true'
        grep -q '@antelopejs/dms-frontend-vue' info.json
        curl -s -o /dev/null -w '%{http_code}' 'http://localhost:5010/dms/page?path=/home' | grep -q 200
      renovate-sync: false
      test-job: true
      windows: true
      docs-files: |
        README.md
    permissions:
      contents: read
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
